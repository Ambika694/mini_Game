<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<style>
  :root {
    --bg: #02060d;
    --ink: #cfeaff;
    --dim: #5d86a6;
    --cyan: #3fd0ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Segoe UI Light", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(ellipse at 50% 40%, #07182b 0%, var(--bg) 65%);
  }
  #orb { width: min(70vmin, 460px); height: min(70vmin, 460px); }
  #status {
    margin-top: 1.2rem; font-size: 1rem; letter-spacing: .28em;
    color: var(--cyan); text-transform: lowercase; min-height: 1.4em;
    transition: opacity .3s;
  }
  #log {
    margin-top: 1.4rem; width: min(90vw, 560px); min-height: 5.5rem;
    text-align: center; line-height: 1.5;
  }
  #log .you { color: var(--dim); font-size: .95rem; }
  #log .jarvis { color: var(--ink); font-size: 1.15rem; margin-top: .4rem; }
  @media (prefers-reduced-motion: reduce) { #status { transition: none; } }
</style>
</head>
<body>
  <canvas id="orb" aria-label="JARVIS status orb"></canvas>
  <div id="status" role="status">starting</div>
  <div id="log" aria-live="polite">
    <div class="you" id="you"></div>
    <div class="jarvis" id="jarvis"></div>
  </div>

<script>
(() => {
  const canvas = document.getElementById("orb");
  const ctx = canvas.getContext("2d");
  const statusEl = document.getElementById("status");
  const youEl = document.getElementById("you");
  const jarvisEl = document.getElementById("jarvis");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Each state is a set of targets the orb eases toward.
  const STATES = {
    idle:      { amp: 0.012, spin: 0.25, glow: 0.55, breathe: 0.012, label: "standing by" },
    listening: { amp: 0.030, spin: 0.60, glow: 0.95, breathe: 0.035, label: "listening" },
    thinking:  { amp: 0.022, spin: 2.60, glow: 0.80, breathe: 0.015, label: "thinking" },
    speaking:  { amp: 0.060, spin: 0.90, glow: 1.15, breathe: 0.020, label: "speaking" }
  };

  let state = "idle";
  const cur = { ...STATES.idle };
  let t = 0;

  function fit() {
    const dpr = window.devicePixelRatio || 1;
    const size = canvas.clientWidth;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", fit);
  fit();

  // Rings: radius (fraction of half-size), wobble lobes, rotation direction, alpha, width
  const rings = [
    { r: 0.78, lobes: 5, dir:  1, a: 0.95, w: 3.2, ph: 0.0 },
    { r: 0.70, lobes: 7, dir: -1, a: 0.70, w: 2.2, ph: 1.7 },
    { r: 0.62, lobes: 3, dir:  1, a: 0.55, w: 1.6, ph: 3.1 },
    { r: 0.84, lobes: 9, dir: -1, a: 0.30, w: 1.0, ph: 4.4 }
  ];

  const motes = Array.from({ length: 36 }, () => ({
    ang: Math.random() * Math.PI * 2,
    rad: 0.55 + Math.random() * 0.5,
    spd: (Math.random() - 0.5) * 0.4,
    sz: 0.6 + Math.random() * 1.6
  }));

  function ease(k, target, rate) { return k + (target - k) * rate; }

  function frame() {
    const p = STATES[state];
    const rate = reduceMotion ? 1 : 0.05;
    cur.amp = ease(cur.amp, p.amp, rate);
    cur.spin = ease(cur.spin, p.spin, rate);
    cur.glow = ease(cur.glow, p.glow, rate);
    cur.breathe = ease(cur.breathe, p.breathe, rate);
    t += (reduceMotion ? 0 : 0.016) * cur.spin;

    const size = canvas.clientWidth;
    const c = size / 2;
    const R = size / 2;
    ctx.clearRect(0, 0, size, size);

    // Speaking: irregular envelope so the orb feels like it follows a voice.
    let voice = 0;
    if (state === "speaking" && !reduceMotion) {
      voice = 0.5 + 0.5 * Math.sin(performance.now() / 85) * Math.sin(performance.now() / 233 + 1.3);
    }
    const breathe = 1 + Math.sin(performance.now() / 700) * cur.breathe + voice * 0.035;

    // Outer glow
    const g = ctx.createRadialGradient(c, c, R * 0.3, c, c, R);
    g.addColorStop(0, `rgba(30,140,255,${0.28 * cur.glow})`);
    g.addColorStop(0.6, `rgba(20,90,220,${0.14 * cur.glow})`);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);

    // Core: dark centre with a blue bloom, like the reference orb
    const core = ctx.createRadialGradient(c, c, 0, c, c, R * 0.62 * breathe);
    core.addColorStop(0, "rgba(2,10,30,0.95)");
    core.addColorStop(0.55, `rgba(10,70,200,${0.55 * cur.glow})`);
    core.addColorStop(1, `rgba(60,200,255,${0.25 * cur.glow})`);
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(c, c, R * 0.62 * breathe, 0, Math.PI * 2);
    ctx.fill();

    // Wobbling rings
    ctx.lineCap = "round";
    ctx.shadowColor = "rgba(63,208,255,0.9)";
    ctx.shadowBlur = 14 * cur.glow;
    for (const ring of rings) {
      const amp = cur.amp + voice * 0.04;
      ctx.beginPath();
      const steps = 180;
      for (let i = 0; i <= steps; i++) {
        const a = (i / steps) * Math.PI * 2;
        const wob = Math.sin(a * ring.lobes + t * ring.dir * 2 + ring.ph)
                  + 0.5 * Math.sin(a * (ring.lobes + 2) - t * 1.3 + ring.ph);
        const rad = R * ring.r * breathe * (1 + wob * amp);
        const x = c + Math.cos(a + t * 0.3 * ring.dir) * rad;
        const y = c + Math.sin(a + t * 0.3 * ring.dir) * rad;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = `rgba(80,210,255,${ring.a * Math.min(cur.glow, 1)})`;
      ctx.lineWidth = ring.w;
      ctx.stroke();
    }

    // Thinking: a bright arc sweeping around the outer ring
    if (state === "thinking") {
      ctx.beginPath();
      const start = t * 2;
      ctx.arc(c, c, R * 0.9, start, start + Math.PI * 0.55);
      ctx.strokeStyle = "rgba(190,240,255,0.95)";
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // Motes
    for (const m of motes) {
      m.ang += m.spd * 0.01 * (1 + cur.spin);
      const x = c + Math.cos(m.ang) * R * m.rad * 0.9;
      const y = c + Math.sin(m.ang) * R * m.rad * 0.9;
      ctx.fillStyle = `rgba(140,225,255,${0.55 * cur.glow})`;
      ctx.beginPath();
      ctx.arc(x, y, m.sz, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- API that Python calls through window.evaluate_js ----
  window.setState = (name) => {
    if (!STATES[name]) return;
    state = name;
    statusEl.textContent = STATES[name].label;
  };
  window.setText = (who, text) => {
    if (who === "you") { youEl.textContent = text ? "You: " + text : ""; }
    else { jarvisEl.textContent = text || ""; }
  };

  window.setState("idle");
})();
</script>
</body>
</html>
